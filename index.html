<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة X-O الاحترافية</title>
    <!-- Open Graph لتويتر و فيسبوك و منصات التواصل الاجتماعي -->
<meta property="og:title" content="لعبة X O اونلاين - تحدى أصدقائك الآن!">
<meta property="og:description" content="اختبر مهاراتك في التخطيط والذكاء مع لعبة  X O. العب مجاناً اونلاين وبدون الحاجة لأي تحميل.">
<meta property="og:image" content="xo.jpg">
<meta property="og:url" content="https://xo-online.haythamzeidan.workers.dev/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="العاب هيثم زيدان منصة ">
<meta property="og:locale" content="ar_AR">
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="لعبة 
X O اونلاين - تحدى أصدقائك الآن!">
<meta name="twitter:description" content="اختبر مهاراتك في التخطيط والذكاء مع لعبة X O  الكلاسيكية. العب مجاناً اونلاين وبدون تحميل.">
<meta name="twitter:image" content="xo.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="landscape-warning" class="landscape-warning">
        <div class="text-center">
            <i class="fa-solid fa-mobile-screen fa-rotate-90 fa-4x mb-3 text-warning bounce-animation"></i>
            <h2>عذراً!</h2>
            <p>للحصول على أفضل تجربة، يرجى تدوير هاتفك للوضع العمودي.</p>
        </div>
    </div>

    <div id="main-container" class="container-fluid app-wrapper d-flex flex-column justify-content-between pb-3">
        
        <header class="text-center pt-4">
            <h1 class="game-title text-primary fw-bold">X-O Master</h1>
            <div class="score-board mt-3">
                <span class="badge bg-dark fs-5">النقاط: <span id="score-display">0</span> / 100</span>
            </div>
        </header>

        <!-- قسم المراحل: مبني كجدول ثابت لضمان ظهوره دائماً -->
        <section id="stages-section" class="flex-grow-1 d-flex flex-column align-items-center justify-content-center mt-3">
            <h4 class="mb-3 text-secondary fw-bold">اختر المرحلة لبدء اللعب</h4>
            <div class="stages-grid shadow-sm" id="stages-grid">
                <div class="stage-btn stage-unlocked" id="btn-stage-1" onclick="openModeSelection(1)">1</div>
                <div class="stage-btn stage-locked" id="btn-stage-2"><i class="fa-solid fa-lock"></i></div>
                <div class="stage-btn stage-locked" id="btn-stage-3"><i class="fa-solid fa-lock"></i></div>
                <div class="stage-btn stage-locked" id="btn-stage-4"><i class="fa-solid fa-lock"></i></div>
                <div class="stage-btn stage-locked" id="btn-stage-5"><i class="fa-solid fa-lock"></i></div>
                <div class="stage-btn stage-locked" id="btn-stage-6"><i class="fa-solid fa-lock"></i></div>
                <div class="stage-btn stage-locked" id="btn-stage-7"><i class="fa-solid fa-lock"></i></div>
                <div class="stage-btn stage-locked" id="btn-stage-8"><i class="fa-solid fa-lock"></i></div>
                <div class="stage-btn stage-locked" id="btn-stage-9"><i class="fa-solid fa-lock"></i></div>
                <div class="stage-btn stage-locked" id="btn-stage-10"><i class="fa-solid fa-lock"></i></div>
            </div>
        </section>

        <!-- قسم لوحة اللعب -->
        <section id="game-section" class="flex-grow-1 d-flex flex-column align-items-center justify-content-center d-none">
            <h3 id="current-stage-title" class="mb-3 text-info fw-bold">المرحلة 1</h3>
            <div id="turn-indicator" class="alert alert-primary mb-3 fw-bold">دور اللاعب: X</div>
            <div class="board" id="board">
                <div class="cell" data-index="0"></div><div class="cell" data-index="1"></div><div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div><div class="cell" data-index="4"></div><div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div><div class="cell" data-index="7"></div><div class="cell" data-index="8"></div>
            </div>
            <button id="back-to-stages" class="btn btn-outline-danger mt-4 rounded-pill px-4 fw-bold"><i class="fa-solid fa-arrow-right"></i> عودة للمراحل</button>
        </section>

       <footer class="text-center mt-3">
            <button id="share-btn" class="btn btn-success rounded-pill mb-2 shadow-sm fw-bold"><i class="fa-solid fa-share-nodes"></i> مشاركة اللعبة</button>
            <p class="copyright-text text-muted small mb-0">تطوير وتصميم: <a href="https://www.patreon.com/haythamzeidan" target="_blank" class="text-decoration-none text-muted"><strong>هيثم زيدان - Haytham Zeidan</strong></a></p>
        </footer>
    </div>

    <!-- الموديلز والأصوات (باقية كما هي) -->
    <div class="modal fade" id="modeModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">اختر نمط اللعب</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <button class="btn btn-primary w-100 mb-3 fw-bold p-3" onclick="startGame('ai')"><i class="fa-solid fa-robot"></i> اللعب ضد الكمبيوتر</button>
                    <button class="btn btn-secondary w-100 fw-bold p-3" onclick="showOnlineSetup()"><i class="fa-solid fa-globe"></i> اللعب مع صديق أونلاين</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="onlineModal" tabindex="-1" aria-hidden="true">
        <!-- محتوى مودال الأونلاين (كما كان مسبقاً) -->
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">اللعب أونلاين</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="player-name" class="form-control mb-3" placeholder="أدخل اسمك...">
                    <div class="input-group mb-3">
                        <input type="text" id="room-code-input" class="form-control" placeholder="كود الغرفة (للإنضمام)">
                        <button class="btn btn-success" onclick="joinRoom()">إنضمام</button>
                    </div>
                    <hr>
                    <button class="btn btn-info w-100 text-white fw-bold" onclick="createRoom()">إنشاء غرفة جديدة وتوليد كود</button>
                    <div id="room-code-display" class="mt-3 text-center d-none">
                        <p>كود غرفتك هو:</p>
                        <h3 id="generated-code" class="text-primary fw-bold"></h3>
                        <button class="btn btn-sm btn-outline-dark mt-2" onclick="copyCode()"><i class="fa-solid fa-copy"></i> نسخ الكود</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio id="win-sound" src="win.wav"></audio>
    <audio id="click-sound" src="losex.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- استدعاء آمن للسوكيت -->
    <script>
        window.io = window.io || undefined;
    </script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
